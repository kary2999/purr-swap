<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="USDT 多渠道比价 / 三段式记账 / 风险提示">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Purr Swap">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Purr Swap · 换金所</title>
  <link rel="manifest" href="manifest.json">

  <!-- 开屏 splash: 加载 Flutter(~3MB)期间先显示品牌猫, 避免空白白屏 -->
  <style>
    #purr-splash{
      position:fixed; inset:0; z-index:99999;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#FBF6F0; transition:opacity .35s ease;
      font-family:"PingFang SC","Noto Sans SC",-apple-system,sans-serif;
    }
    #purr-splash img{ width:112px; height:112px; border-radius:26px;
      box-shadow:0 8px 24px rgba(232,112,74,.18); }
    #purr-splash .nm{ margin-top:18px; font-size:18px; font-weight:600; color:#1F2937; letter-spacing:.5px; }
    #purr-splash .sp{ margin-top:18px; width:22px; height:22px; border-radius:50%;
      border:2.5px solid rgba(232,112,74,.25); border-top-color:#E8704A;
      animation:purr-spin .8s linear infinite; }
    @keyframes purr-spin{ to{ transform:rotate(360deg); } }
    #purr-splash.hide{ opacity:0; pointer-events:none; }
  </style>
</head>
<body>
  <div id="purr-splash">
    <img src="icons/Icon-512.png" alt="Purr Swap">
    <div class="nm">Purr Swap · 换金所</div>
    <div class="sp"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function(){
      function hide(){ var s=document.getElementById('purr-splash');
        if(s){ s.classList.add('hide'); setTimeout(function(){ if(s) s.remove(); }, 400); } }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 15000); // 兜底: 万一事件没触发也不会卡死在 splash
    })();
  </script>
</body>
</html>
