name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build macOS (unsigned)
        run: flutter build macos --release
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"

      - name: Zip .app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/PurrSwap-macos-${{ github.ref_name }}.zip" "USDT Exchange.app"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ github.ref_name }}
          path: PurrSwap-macos-${{ github.ref_name }}.zip
          retention-days: 14
