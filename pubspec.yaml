name: currency_exchange
description: Purr Swap · 换金所 — USDT 多渠道比价 / 记账 / 风险提示
publish_to: 'none'
version: 0.3.8

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  path: ^1.9.0
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  # 以下两个是为了手动注册 web 插件 (Flutter 3.41 auto-register bug)
  shared_preferences_web: ^2.4.0
  url_launcher_web: ^2.3.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: false
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/guide/raw/
    - assets/icon/
    - assets/data/
  fonts:
    - family: LXGW
      fonts:
        - asset: assets/fonts/ChineseFont.ttf
